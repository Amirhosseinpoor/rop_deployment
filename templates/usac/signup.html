{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | MediversAI</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="{% static 'icons/mediversai_logo_final-032.png' %}" type="image/png">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .fade-slide {
            animation: fadeSlide 0.6s ease-out;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        input:focus {
            outline: none;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">

    <div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-sm fade-slide text-center">
        <!-- ✅ لوگو -->
        <div class="mb-6">
            <img src="{% static 'icons/mediversai_logo_final-03.png' %}" alt="MediversAI Logo"
                 class="h-12 mx-auto opacity-90">
        </div>

        <h2 class="text-2xl font-bold text-gray-800 mb-2">Create Account</h2>
        <p class="text-xs text-gray-500 mb-6">Join the MediversAI Medical AI System</p>

        <form method="post" class="space-y-5 text-left">
            {% csrf_token %}
            {% for field in form %}
    <div>
        <input
            type="{{ field.field.widget.input_type }}"
            name="{{ field.html_name }}"
            value="{{ field.value|default:'' }}"
            placeholder="{{ field.label }}"
            class="w-full border-b border-gray-300 py-2 text-sm placeholder-gray-400 bg-transparent focus:border-green-500 transition duration-200"
            {% if field.field.required %} required {% endif %}
        >

        {% if field.errors %}
            <ul class="mt-2 text-xs text-red-600 space-y-1 bg-red-50 border border-red-200 p-2 rounded-md">
                {% for error in field.errors %}
                    <li class="flex items-center gap-1"> {{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
{% endfor %}


            <button type="submit"
                    class="w-full text-sm py-2 rounded-full bg-green-600 hover:bg-green-700 text-white font-semibold transition duration-200 shadow-sm">
                Sign Up
            </button>
        </form>

        <p class="text-xs text-center text-gray-500 mt-6">
            Already have an account?
            <a href="{% url 'login' %}" class="text-blue-500 hover:underline font-medium">Log in</a>
        </p>
    </div>

</body>
</html>
