{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
    <link rel="icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-md rounded-3xl p-8 max-w-sm w-full">
    <div class="flex flex-col items-center mb-6">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" class="w-12 h-12 mb-2 opacity-80" alt="Logo">
        <h2 class="text-2xl font-bold text-blue-600 text-center">Create Account</h2>
        <p class="text-xs text-gray-500">Join the Medivers AI Medical AI System</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm text-gray-700 mb-1">{{ field.label }}</label>
                <input
                        type="{{ field.field.widget.input_type }}"
                        name="{{ field.html_name }}"
                        value="{{ field.value|default:'' }}"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
                        {% if field.field.required %} required {% endif %}
                >
                {% if field.errors %}
                    <p class="text-xs text-red-600 mt-1">{{ field.errors }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-full transition-all text-sm font-medium">
            Sign Up
        </button>
    </form>

    <p class="text-center mt-6 text-sm">
        Already have an account? <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Log in</a>
    </p>
</div>
</body>
</html>
