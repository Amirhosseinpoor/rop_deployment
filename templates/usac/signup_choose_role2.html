{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>انتخاب نقش | MediverseAI</title>

<!-- فونت داخلی وزیر -->
<style>
@font-face {
    font-family: "Vazir";
    src: url("{% static 'fonts/Vazirmatn-Regular.woff2' %}") format("woff2");
}
@font-face {
    font-family: "Vazir";
    src: url("{% static 'fonts/Vazirmatn-Bold.woff2' %}") format("woff2");
    font-weight: bold;
}

/* Reset */
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:Vazir,sans-serif;
    background:radial-gradient(circle at 30% 20%, #c9eaff, #eaf3ff, #f8faff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    overflow-x:hidden;
    position:relative;
}

/* glowing blobs */
.bg1,.bg2{
    position:absolute;
    width:420px;height:420px;
    filter:blur(80px);
    animation:float 7s ease-in-out infinite alternate;
}
.bg1{
    background:radial-gradient(circle,rgba(80,155,255,.55),transparent 70%);
    top:-120px;right:-80px;
}
.bg2{
    background:radial-gradient(circle,rgba(160,110,255,.45),transparent 70%);
    bottom:-120px;left:-80px;
}
@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(30px);}
}

/* container */
.card{
    width:100%;
    max-width:820px;
    padding:35px 40px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(22px) saturate(180%);
    border-radius:26px;
    border:1px solid rgba(255,255,255,0.38);
    box-shadow:
        0 12px 40px rgba(0,0,0,0.08),
        inset 0 0 25px rgba(255,255,255,0.4);
    animation:fadeIn .7s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}

/* header text */
.title{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    margin-top:10px;
}
.subtitle{
    text-align:center;
    margin-top:6px;
    font-size:13px;
    color:#555;
}

/* grid for roles */
.grid{
    margin-top:32px;
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
}
@media(min-width:540px){
    .grid{grid-template-columns:repeat(3,1fr);}
}

/* each role card */
.role-option{
    border:1px solid #d9d9d9;
    border-radius:22px;
    padding:28px 12px;
    cursor:pointer;
    text-align:center;
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(10px);
    transition:.25s;
    box-shadow:0 6px 20px rgba(0,0,0,0.06);
    position:relative;
}
.role-option:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 28px rgba(0,0,0,0.10);
}

/* active selection */
.role-option.active{
    border-color:#7c3aed;
    background:rgba(240,235,255,0.75);
    box-shadow:0 0 0 3px rgba(124,58,237,0.25),0 10px 30px rgba(124,58,237,0.25);
}

/* icon */
.role-icon{
    width:48px;height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    margin:auto;
    margin-bottom:10px;
}

/* colors */
.manager-icon{background:#eef2ff;color:#4f46e5;}
.doctor-icon{background:#d1fae5;color:#059669;}
.employee-icon{background:#fef3c7;color:#d97706;}

.role-title{
    font-weight:bold;
    margin-bottom:4px;
}
.role-desc{
    font-size:12px;
    color:#666;
}

/* submit button */
.submit-btn{
    margin-top:32px;
    width:100%;
    padding:14px;
    border-radius:18px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    border:none;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.25s;
    box-shadow:0 10px 25px rgba(99,102,241,0.35);
}
.submit-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 32px rgba(99,102,241,0.45);
}

/* footer */
.footer{
    text-align:center;
    font-size:12px;
    margin-top:22px;
    color:#666;
}

/* dark mode */
.dark body{
    background:radial-gradient(circle at 30% 20%, #0f172a,#1e1b4b,#251f52);
}
.dark .card{
    background:rgba(30,33,55,0.55);
    border-color:rgba(255,255,255,0.08);
    box-shadow:0 12px 40px rgba(0,0,0,0.25), inset 0 0 20px rgba(255,255,255,0.06);
}
.dark .role-option{
    background:rgba(255,255,255,0.08);
    color:#eee;
    border-color:#334155;
}
.dark .role-option.active{
    background:rgba(124,58,237,0.25);
    border-color:#8b5cf6;
}
.dark .role-desc{color:#bbb;}
.dark .footer{color:#aaa;}

/* theme toggle */
.theme-toggle{
    position:fixed;
    left:20px;
    top:20px;
    padding:10px 12px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(10px);
    border-radius:14px;
    cursor:pointer;
    font-size:20px;
    transition:.25s;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
.dark .theme-toggle{
    background:rgba(20,25,40,0.6);
    color:white;
}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="theme-toggle" id="themeToggle">🌓</div>

<div class="card">

    <div style="text-align:center;">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" style="height:52px;opacity:.92;">
        <div class="title">انتخاب نقش</div>
        <div class="subtitle">ابتدا موقعیت خود را مشخص کنید.</div>
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="grid">

            <!-- مدیر -->
            <label class="role-option">
                <input type="radio" name="role" value="manager" hidden>
                <div class="role-icon manager-icon">👤</div>
                <div class="role-title">مدیر</div>
                <div class="role-desc">ثبت شرکت + حساب مدیریت</div>
            </label>

            <!-- پزشک -->
            <label class="role-option">
                <input type="radio" name="role" value="doctor" hidden>
                <div class="role-icon doctor-icon">🩺</div>
                <div class="role-title">پزشک</div>
                <div class="role-desc">ثبت نام با دعوت‌نامه</div>
            </label>

            <!-- کارمند -->
            <label class="role-option">
                <input type="radio" name="role" value="employee" hidden>
                <div class="role-icon employee-icon">💼</div>
                <div class="role-title">کارمند</div>
                <div class="role-desc">ثبت‌نام با دعوت‌نامه</div>
            </label>

        </div>

        {% if form.non_field_errors %}
        <div style="color:#b91c1c; margin-top:12px; font-size:13px;">
            {{ form.non_field_errors }}
        </div>
        {% endif %}

        <button class="submit-btn">ادامه</button>

    </form>

    <div class="footer">
        قبلاً ثبت‌نام کرده‌اید؟
        <a href="{% url 'login' %}" style="color:#7c3aed;font-weight:bold;">ورود</a>
    </div>

</div>

<script>
/* theme toggle */
const root=document.documentElement;
document.getElementById("themeToggle").onclick=()=>{
    root.classList.toggle("dark");
    localStorage.setItem("theme",root.classList.contains("dark")?"dark":"light");
};
if(localStorage.getItem("theme")==="dark") root.classList.add("dark");

/* selection logic */
document.querySelectorAll('.role-option').forEach(card=>{
    card.addEventListener('click',()=>{
        document.querySelectorAll('.role-option').forEach(c=>c.classList.remove('active'));
        card.classList.add('active');
        card.querySelector("input").checked=true;
    });
});
</script>

</body>
</html>
