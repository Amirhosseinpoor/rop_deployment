{% load static %}
{% load static socialaccount %}

<!DOCTYPE html>
<html lang="fa" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ورود به MediverseAI</title>

    <!-- استفاده از Tailwind با تنظیمات بهینه -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f4ff', 100: '#d9e2ff', 200: '#b9c9ff', 300: '#8da4ff', 400: '#5a76ff', 500: '#3d56f5', 600: '#2a39e8', 700: '#212ccf', 800: '#1f27a7', 900: '#1f2785', 950: '#12154d' },
                    },
                    borderRadius: { '3xl': '1.5rem', '4xl': '2rem' }
                }
            }
        }
    </script>

    <style>
        /* فونت جایگزین برای حل مشکل فیلترینگ گوگل فونت */
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2');
            font-weight: 400;
        }
        @font-face {
            font-family: 'Vazirmatn';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2');
            font-weight: 700;
        }

        body {
            font-family: 'Vazirmatn', ui-sans-serif, system-ui;
            background: radial-gradient(circle at top right, #eef2ff, #f8fafc);
        }
        .dark body {
            background: radial-gradient(circle at top right, #1e1b4b, #020617);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 antialiased transition-colors duration-500">

    <!-- دکمه تغییر تم مدرن -->
    <button id="themeToggle" class="fixed top-6 left-6 z-50 p-3 rounded-2xl glass-card shadow-xl hover:scale-110 transition-all text-slate-600 dark:text-slate-300">
        <svg id="sun" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4-9H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>
        <svg id="moon" class="w-6 h-6 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    </button>

    <div class="w-full max-w-[440px] animate-fade-in">
        <div class="glass-card rounded-4xl shadow-2xl overflow-hidden relative p-8 md:p-10">

            <!-- دکوراسیون پس‌زمینه کارت -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-500/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl"></div>

            <!-- لوگو و تیتر -->
            <div class="text-center relative z-10 mb-10">
                <div class="inline-flex p-3 rounded-2xl bg-white dark:bg-slate-800 shadow-lg mb-4">
                    <img src="{% static 'icons/mediversai_logo_final-03.png' %}" alt="MediverseAI" class="h-10 w-auto">
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">خوش آمدید</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">به پلتفرم هوشمند MediverseAI وارد شوید</p>
            </div>

            <!-- فرم ورود -->
            <form method="post" class="space-y-6 relative z-10" novalidate>
                {% csrf_token %}

                {% if error %}
                <div class="flex items-center gap-3 p-4 rounded-2xl bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-800/30 text-red-600 dark:text-red-400 text-sm animate-pulse">
                    <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- نام کاربری -->
                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-700 dark:text-slate-300 mr-1">نام کاربری</label>
                    <div class="relative group">
                        <input type="text" name="username" required placeholder="example_user"
                            class="w-full pr-12 pl-4 py-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary-500 focus:ring-0 outline-none input-focus">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        </div>
                    </div>
                </div>

                <!-- رمز عبور -->
                <div class="space-y-2">
                    <label class="text-sm font-bold text-slate-700 dark:text-slate-300 mr-1">رمز عبور</label>
                    <div class="relative group">
                        <input id="password" type="password" name="password" required placeholder="••••••••"
                            class="w-full pr-12 pl-12 py-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-900/50 text-slate-900 dark:text-white placeholder-slate-400 focus:border-primary-500 focus:ring-0 outline-none input-focus">
                        <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-primary-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                        </div>
                        <button type="button" id="togglePassword" class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 hover:text-primary-500 transition-colors">
                            <svg id="eyeOff" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                            <svg id="eyeOn" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" name="remember" class="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500 transition-all cursor-pointer">
                        <span class="text-xs font-medium text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">مرا به خاطر بسپار</span>
                    </label>
                </div>

                <button type="submit" class="w-full py-4 rounded-2xl bg-gradient-to-r from-primary-600 to-indigo-600 hover:from-primary-700 hover:to-indigo-700 text-white font-bold shadow-lg shadow-primary-500/25 transform active:scale-[0.98] transition-all">
                    ورود به حساب کاربری
                </button>
            </form>

            <!-- جدا کننده -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200 dark:border-slate-700"></span></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white dark:bg-[#0f172a] px-4 text-slate-500 font-bold">یا</span></div>
            </div>

            <!-- ورود گوگل کاملاً داخلی (بدون تصویر خارجی) -->
            <a href="{% provider_login_url 'google' %}"
               class="w-full flex items-center justify-center gap-3 py-3.5 rounded-2xl border-2 border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-900/50 text-slate-700 dark:text-slate-200 font-bold hover:bg-slate-50 dark:hover:bg-slate-800 transition-all active:scale-[0.98]">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.16H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.84l3.66-2.75z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.16l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                <span>ورود با حساب گوگل</span>
            </a>

            <!-- ثبت نام -->
            <p class="text-center mt-8 text-slate-500 dark:text-slate-400 text-sm font-medium">
                هنوز عضو نشده‌اید؟
                <a href="{% url 'signup_choose_role' %}" class="text-primary-600 dark:text-primary-400 font-bold hover:underline underline-offset-4">ایجاد حساب جدید</a>
            </p>
        </div>
    </div>

    <script>
        // مدیریت تم (Theme Management)
        const root = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');

        function updateTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' ||
                (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);

            if (isDark) {
                root.classList.add('dark');
            } else {
                root.classList.remove('dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            root.classList.toggle('dark');
            localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
        });

        // نمایش/مخفی کردن رمز عبور
        const passInput = document.getElementById('password');
        const toggleBtn = document.getElementById('togglePassword');
        const eyeOn = document.getElementById('eyeOn');
        const eyeOff = document.getElementById('eyeOff');

        toggleBtn.addEventListener('click', () => {
            const isHidden = passInput.type === 'password';
            passInput.type = isHidden ? 'text' : 'password';
            eyeOn.classList.toggle('hidden', !isHidden);
            eyeOff.classList.toggle('hidden', isHidden);
        });

        updateTheme();
    </script>
</body>
</html>
