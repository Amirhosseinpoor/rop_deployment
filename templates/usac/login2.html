{% load static %}
{% load static socialaccount %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ورود | MediverseAI</title>
    <link rel="icon" href="{% static 'icons/mediversai_logo_final-032.png' %}" type="image/png">
    <style>
        /* ------------------------- */
        /* فونت وزیر (آفلاین) */
        /* ------------------------- */
        @font-face {
            font-family: "Vazir";
            src: url("{% static 'fonts/Vazirmatn-Regular.woff2' %}") format("woff2");
            font-weight: normal;
        }
        @font-face {
            font-family: "Vazir";
            src: url("{% static 'fonts/Vazirmatn-Bold.woff2' %}") format("woff2");
            font-weight: bold;
        }

        /* ------------------------- */
        /* متغیرهای ریشه */
        /* ------------------------- */
        :root {
            --medical-blue: #0A6EFF;
            --medical-teal: #00A896;
            --medical-light: #E8F2FE;
            --white-soft: #FFFFFF;
            --gray-100: #F8FAFD;
            --gray-200: #E9EDF5;
            --gray-600: #5B6B7C;
            --gray-800: #1E293B;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 32px rgba(0,0,0,0.08);
            --shadow-glow: 0 0 24px rgba(10,110,255,0.18);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        /* ------------------------- */
        /* ریست */
        /* ------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Vazir", sans-serif;
            background: linear-gradient(150deg, #E3F0FD 0%, #F2F8FF 50%, #FFFFFF 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        /* ------------------------- */
        /* الگوی هگزاگونال پزشکی (آفلاین) */
        /* ------------------------- */
        .medical-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L52.5 17.5V42.5L30 55L7.5 42.5V17.5L30 5Z' fill='none' stroke='%230A6EFF' stroke-opacity='0.07' stroke-width='1'/%3E%3C/svg%3E");
            background-size: 80px 80px;
            opacity: 0.35;
        }

        /* ------------------------- */
        /* کارت اصلی */
        /* ------------------------- */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: var(--radius-xl);
            padding: 32px 36px 28px;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            animation: cardAppear 0.6s ease-out;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ------------------------- */
        /* نوار مانیتورینگ قلب (EKG) */
        /* ------------------------- */
        .medical-line {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
            width: 100%;
            height: 45px;
            position: relative;
        }
        .medical-line svg {
            width: 100%;
            height: 45px;
            overflow: visible;
        }
        .ekg-line {
            fill: none;
            stroke: var(--medical-blue);
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            animation: drawEKG 2s ease-out forwards;
        }
        @keyframes drawEKG {
            to { stroke-dashoffset: 0; }
        }

        /* نقطه متحرک (ضربان) */
        .moving-dot {
            fill: #00E5FF;
            filter: url(#glow);
            r: 3.5;
            offset-path: path("M 5,25 L 15,25 L 20,20 L 25,25 L 30,25 L 34,25 L 36,5 L 39,45 L 42,25 L 46,25 L 50,18 L 54,25 L 60,25 L 80,25 L 120,25 L 200,25");
            animation: travel 2.2s linear infinite 2.5s;
            opacity: 0;
            animation-fill-mode: forwards;
        }
        @keyframes travel {
            0% {
                offset-distance: 0%;
                opacity: 1;
            }
            5% {
                opacity: 1;
            }
            95% {
                opacity: 1;
            }
            100% {
                offset-distance: 100%;
                opacity: 0;
            }
        }

        /* ------------------------- */
        /* لوگو و تیتر */
        /* ------------------------- */
        .logo-area {
            text-align: center;
            margin-bottom: 24px;
        }
        .logo {
            height: 60px;
            margin-bottom: 8px;
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            color: var(--gray-800);
            letter-spacing: -0.3px;
        }
        .subtitle {
            color: var(--gray-600);
            font-size: 14px;
            margin-top: 6px;
        }

        /* ------------------------- */
        /* پیام خطا */
        /* ------------------------- */
        .error-box {
            background: #FFF0F0;
            border: 1px solid #FFC9C9;
            color: #C00020;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }

        /* ------------------------- */
        /* فرم و اینپوت */
        /* ------------------------- */
        .input-group {
            margin-bottom: 14px;
        }
        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-800);
            display: block;
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 14px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            background: rgba(248,250,253,0.7);
            backdrop-filter: blur(6px);
            font-size: 14px;
            color: var(--gray-800);
            transition: var(--transition);
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: var(--medical-blue);
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 4px rgba(10,110,255,0.12);
        }
        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.55;
            font-size: 18px;
            color: var(--medical-blue);
        }

        /* ------------------------- */
        /* دکمه ورود (بدون آیکون) */
        /* ------------------------- */
        .btn-login {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, #0A6EFF, #3B82F6);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(10,110,255,0.28);
            transition: var(--transition);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(10,110,255,0.4);
        }

        /* ------------------------- */
        /* جداکننده */
        /* ------------------------- */
        .divider {
            display: flex;
            align-items: center;
            margin: 18px 0;
            color: var(--gray-600);
            font-size: 13px;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }
        .divider span {
            margin: 0 14px;
        }

        /* ------------------------- */
        /* دکمه گوگل (آیکون واقعی) */
        /* ------------------------- */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 11px;
            border-radius: var(--radius-lg);
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(8px);
            border: 1px solid var(--gray-200);
            color: var(--gray-800);
            text-decoration: none;
            font-size: 15px;
            transition: var(--transition);
        }
        .google-btn:hover {
            background: #ffffff;
            border-color: var(--medical-blue);
            transform: translateY(-1px);
        }
        .google-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ------------------------- */
        /* لینک ثبت‌نام */
        /* ------------------------- */
        .signup-link {
            text-align: center;
            margin-top: 26px;
            font-size: 14px;
            color: var(--gray-600);
        }
        .signup-link a {
            color: var(--medical-blue);
            font-weight: bold;
            text-decoration: none;
        }

        /* ------------------------- */
        /* دکمه تغییر تم */
        /* ------------------------- */
        .theme-toggle {
            position: fixed;
            left: 24px;
            top: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            z-index: 100;
        }
        .theme-toggle:hover {
            background: white;
            box-shadow: var(--shadow-md);
        }

        /* ------------------------- */
        /* حالت تاریک */
        /* ------------------------- */
        .dark body {
            background: linear-gradient(150deg, #0B1121 0%, #131A2E 50%, #1A2540 100%);
        }
        .dark .medical-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L52.5 17.5V42.5L30 55L7.5 42.5V17.5L30 5Z' fill='none' stroke='%234F90FF' stroke-opacity='0.12' stroke-width='1'/%3E%3C/svg%3E");
            opacity: 0.25;
        }
        .dark .card {
            background: rgba(24,30,50,0.8);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 0 30px rgba(255,255,255,0.03);
        }
        .dark .title,
        .dark label {
            color: #EDF2F9;
        }
        .dark .subtitle,
        .dark .signup-link {
            color: #B9C5DA;
        }
        .dark .input-wrapper input {
            background: rgba(30,40,65,0.7);
            border-color: #334155;
            color: #F1F5F9;
        }
        .dark .input-wrapper input:focus {
            border-color: #4F90FF;
            background: rgba(40,50,75,0.9);
        }
        .dark .google-btn {
            background: rgba(255,255,255,0.08);
            border-color: #2D3A50;
            color: #E2E8F0;
        }
        .dark .google-btn:hover {
            background: rgba(255,255,255,0.14);
        }
        .dark .btn-login {
            background: linear-gradient(135deg, #2A6EFF, #4F8CFF);
        }
        .dark .divider::before,
        .dark .divider::after {
            background: #2D3A50;
        }
        .dark .theme-toggle {
            background: rgba(30,40,65,0.8);
            color: #E2E8F0;
            border-color: rgba(255,255,255,0.1);
        }
        .dark .ekg-line {
            stroke: #4F90FF;
        }
        .dark .moving-dot {
            fill: #00E5FF;
            filter: url(#glow-dark);
        }
    </style>
</head>
<body>
    <!-- الگوی هگزاگونال پس‌زمینه -->
    <div class="medical-bg"></div>

    <!-- دکمه تغییر تم -->
    <div class="theme-toggle" id="themeToggle">🌓</div>

    <!-- کارت اصلی -->
    <div class="card">
        <!-- نوار قلب (EKG) واقعی‌تر با نقطه ضربان -->
        <div class="medical-line">
            <svg viewBox="0 0 220 45" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="3" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <!-- مسیر EKG -->
                <path class="ekg-line" d="M 5,25 L 15,25 L 20,20 L 25,25 L 30,25 L 34,25 L 36,5 L 39,45 L 42,25 L 46,25 L 50,18 L 54,25 L 60,25 L 80,25 L 120,25 L 200,25" />
                <!-- نقطه متحرک -->
                <circle class="moving-dot" cx="0" cy="0" />
            </svg>
        </div>

        <!-- لوگو و عنوان -->
        <div class="logo-area">
            <img src="{% static 'icons/mediversai_logo_final-03.png' %}" class="logo" alt="MediverseAI">
            <div class="title">ورود به MediverseAI</div>
            <div class="subtitle">پلتفرم هوش مصنوعی پزشکی</div>
        </div>

        <!-- فرم -->
        <form method="post" novalidate>
            {% csrf_token %}
            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <div class="input-group">
                <label>نام کاربری</label>
                <div class="input-wrapper">
                    <input name="username" autocomplete="username" placeholder="نام کاربری خود را وارد کنید">
                    <span class="input-icon">👤</span>
                </div>
            </div>

            <div class="input-group">
                <label>رمز عبور</label>
                <div class="input-wrapper">
                    <input id="password" type="password" name="password" autocomplete="current-password" placeholder="••••••••">
                    <span class="input-icon">🔒</span>
                </div>
            </div>

            <button class="btn-login" type="submit">
                ورود به حساب
            </button>
        </form>

        <!-- جداکننده -->
        <div class="divider">
            <span>یا</span>
        </div>

        <!-- ورود با گوگل (آیکون واقعی) -->
        <a href="{% provider_login_url 'google' %}" class="google-btn">
            <span class="google-icon">
                <!-- آیکون گوگل G (چند رنگی) -->
                <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </span>
            ورود با حساب گوگل
        </a>

        <!-- لینک ثبت‌نام -->
        <div class="signup-link">
            حساب کاربری ندارید؟
            <a href="{% url 'signup_choose_role' %}">ثبت‌نام کنید</a>
        </div>
    </div>

    <script>
        const root = document.documentElement;
        const toggleBtn = document.getElementById("themeToggle");
        toggleBtn.onclick = () => {
            root.classList.toggle("dark");
            localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
        };
        if (localStorage.getItem("theme") === "dark") {
            root.classList.add("dark");
        }
    </script>
</body>
</html>
