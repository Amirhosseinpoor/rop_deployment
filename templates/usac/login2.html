{% load static %}
{% load static socialaccount %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ورود | MediverseAI</title>

<style>

/* ------------------------- */
/* فونت داخلی وزیر */
/* ------------------------- */
@font-face {
    font-family: "Vazir";
    src: url("{% static 'fonts/Vazirmatn-Regular.woff2' %}") format("woff2");
    font-weight: normal;
}
@font-face {
    font-family: "Vazir";
    src: url("{% static 'fonts/Vazirmatn-Bold.woff2' %}") format("woff2");
    font-weight: bold;
}

/* ------------------------- */
/* Reset */
/* ------------------------- */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:Vazir, sans-serif;
    background: radial-gradient(circle at 30% 20%, #c9eaff, #eaf3ff, #f8faff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
    position:relative;
    overflow:hidden;
}

/* ------------------------- */
/* افکت‌های نورپردازی پس‌زمینه */
/* ------------------------- */
.bg-glow{
    position:absolute;
    width:420px;
    height:420px;
    background:radial-gradient(circle, rgba(90,180,255,0.55), transparent 70%);
    top:-80px;
    right:-80px;
    filter:blur(70px);
    animation: floatGlow 6s ease-in-out infinite alternate;
}
.bg-glow2{
    position:absolute;
    width:420px;
    height:420px;
    background:radial-gradient(circle, rgba(155,110,255,0.4), transparent 70%);
    bottom:-100px;
    left:-100px;
    filter:blur(80px);
    animation: floatGlow 7s ease-in-out infinite alternate-reverse;
}

@keyframes floatGlow{
    0%{ transform:translateY(0); opacity:.8;}
    100%{ transform:translateY(25px); opacity:1;}
}

/* ------------------------- */
/* کارت اصلی */
/* ------------------------- */
.card{
    width:100%;
    max-width:440px;
    padding:40px 35px;
    border-radius:24px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,0.38);
    box-shadow:
        0px 12px 40px rgba(0,0,0,0.08),
        inset 0px 0px 30px rgba(255,255,255,0.4);
    animation:fadeIn .7s ease;
    position:relative;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(25px);}
    to{opacity:1; transform:translateY(0);}
}

/* ------------------------- */
/* عنوان و لوگو */
/* ------------------------- */
.logo{
    height:54px;
    margin-bottom:10px;
    opacity:.93;
}
.title{
    font-size:26px;
    font-weight:bold;
    text-align:center;
}
.subtitle{
    text-align:center;
    margin-top:6px;
    font-size:13px;
    color:#5b5b5b;
}

/* ------------------------- */
/* ورودی‌ها */
/* ------------------------- */
.input-group{
    margin-top:22px;
}
label{
    font-size:13px;
    display:block;
    margin-bottom:6px;
    color:#2c2c2c;
}
.input-field{
    position:relative;
}
.input-field input{
    width:100%;
    padding:14px 45px 14px 12px;
    border-radius:16px;
    border:1px solid #d4d7dd;
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(8px);
    transition:.25s;
    font-size:14px;
}
.input-field input:focus{
    border-color:#7c3aed;
    background:rgba(255,255,255,0.92);
    box-shadow:0 0 0 4px rgba(124,58,237,0.25);
}

/* آیکون داخلی */
.input-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    opacity:.55;
    font-size:17px;
}

/* ------------------------- */
/* دکمه ورود */
/* ------------------------- */
.btn-submit{
    width:100%;
    margin-top:26px;
    padding:14px;
    border-radius:18px;
    border:none;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    background:linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow:0 8px 25px rgba(99,102,241,0.35);
    transition:.25s;
}
.btn-submit:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(99,102,241,0.42);
}

/* ------------------------- */
/* Divider */
/* ------------------------- */
.divider{
    text-align:center;
    margin:28px 0;
    position:relative;
    color:#7d7d7d;
}
.divider:before,
.divider:after{
    content:"";
    position:absolute;
    top:50%;
    width:34%;
    height:1px;
    background:#d8d8d8;
}
.divider:before{ right:0; }
.divider:after{ left:0; }

/* ------------------------- */
/* Google Button */
/* ------------------------- */
.google-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:12px;
    border-radius:16px;
    background:rgba(255,255,255,0.8);
    backdrop-filter:blur(10px);
    border:1px solid #d9d9d9;
    color:#444;
    text-decoration:none;
    transition:.25s;
    font-size:14px;
}
.google-btn:hover{
    background:#ffffff;
    transform:translateY(-2px);
}

/* ------------------------- */
/* حالت تاریک حرفه‌ای */
/* ------------------------- */
.dark body{
    background:radial-gradient(circle at 20% 20%, #0f172a, #1e1b4b, #251f52);
}
.dark .card{
    background:rgba(30,33,55,0.55);
    border-color:rgba(255,255,255,0.08);
    box-shadow:
        0px 12px 40px rgba(0,0,0,0.25),
        inset 0px 0px 25px rgba(255,255,255,0.05);
}
.dark label{ color:#ddd; }
.dark .subtitle{ color:#bbb; }
.dark .input-field input{
    background:rgba(40,45,70,0.55);
    border-color:#475569;
    color:#fff;
}
.dark .google-btn{
    background:rgba(255,255,255,0.1);
    color:#eee;
    border-color:#334155;
}

/* ------------------------- */
/* دکمه تغییر تم */
/* ------------------------- */
.theme-toggle{
    position:fixed;
    left:20px;
    top:20px;
    padding:10px 12px;
    border-radius:14px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(10px);
    cursor:pointer;
    transition:.25s;
    font-size:20px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
.dark .theme-toggle{
    background:rgba(20,25,40,0.6);
    color:white;
}

/* ------------------------- */

</style>
</head>

<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="theme-toggle" id="themeToggle">🌓</div>

<div class="card">

    <div style="text-align:center;">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" class="logo">
        <div class="title">خوش آمدید</div>
        <div class="subtitle">برای ادامه وارد شوید</div>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}

        {% if error %}
        <div style="background:#fee2e2; border:1px solid #fecaca; color:#b91c1c; padding:10px; border-radius:12px; margin-bottom:12px; font-size:13px; text-align:center;">
            {{ error }}
        </div>
        {% endif %}

        <div class="input-group">
            <label>نام کاربری</label>
            <div class="input-field">
                <input name="username" autocomplete="username">
                <span class="input-icon">👤</span>
            </div>
        </div>

        <div class="input-group">
            <label>رمز عبور</label>
            <div class="input-field">
                <input id="password" type="password" name="password" autocomplete="current-password">
                <span class="input-icon">🔒</span>
            </div>
        </div>

        <button class="btn-submit">ورود</button>
    </form>

    <div class="divider">یا</div>

    <a href="{% provider_login_url 'google' %}" class="google-btn">
        <span style="font-size:18px;">🟢</span>
        ورود با گوگل
    </a>

    <p style="text-align:center; margin-top:22px; font-size:13px;">
        حساب ندارید؟
        <a href="{% url 'signup_choose_role' %}" style="color:#7c3aed; font-weight:bold;">ثبت‌نام</a>
    </p>

</div>

<script>
const root = document.documentElement;
document.getElementById("themeToggle").onclick = () => {
    root.classList.toggle("dark");
    localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
};
if (localStorage.getItem("theme") === "dark") root.classList.add("dark");
</script>

</body>
</html>
