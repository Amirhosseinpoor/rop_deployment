{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose App</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
    <link rel="icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-md rounded-3xl p-8 max-w-sm w-full text-center">
    <div class="flex flex-col items-center mb-6">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" class="w-12 h-12 mb-2 opacity-80" alt="Logo">
        <h2 class="text-2xl font-bold text-blue-600">Select Your Image Type</h2>
        <p class="text-xs text-gray-500">Choose the AI module you want to use</p>
    </div>

    <div class="space-y-4">
        <a href="{% url 'home' %}"
           class="block w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded-full transition-all font-medium">
            ROP
        </a>
        <a href="{% url 'double_home' %}"
           class="block w-full bg-purple-500 hover:bg-purple-600 text-white py-2 rounded-full transition-all font-medium">
            KC
        </a>
        <a href="{% url 'history' %}"
           class="block w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-full transition-all font-medium">
            History
        </a>
    </div>

    <form method="post" action="{% url 'logout' %}" class="mt-6">
        {% csrf_token %}
        <button type="submit" class="text-sm text-red-600 hover:underline">Logout</button>
    </form>
</div>
</body>
</html>
