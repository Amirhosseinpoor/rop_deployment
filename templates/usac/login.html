{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
    <link rel="icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-md rounded-3xl p-8 max-w-sm w-full">
    <div class="flex flex-col items-center mb-6">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" class="w-12 h-12 mb-2 opacity-80" alt="Logo">
        <h2 class="text-2xl font-bold text-blue-600 text-center">Login</h2>
        <p class="text-xs text-gray-500">Access your account</p>
    </div>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if error %}
            <p class="text-red-600 text-sm text-center">{{ error }}</p>
        {% endif %}
        <div>
            <label class="block text-sm text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <div>
            <label class="block text-sm text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-full transition-all text-sm font-medium">
            Login
        </button>
    </form>

    <p class="text-center mt-6 text-sm">
        Don't have an account? <a href="{% url 'signup' %}" class="text-blue-500 hover:underline">Sign up</a>
    </p>
</div>
</body>
</html>
