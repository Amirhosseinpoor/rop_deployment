{% load static %}
{% load static socialaccount %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | MediversAI</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" href="{% static 'icons/mediversai_logo_final-032.png' %}" type="image/png">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .fade-slide { animation: fadeSlide 0.6s ease-out; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input:focus { outline: none; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
<div class="bg-white rounded-2xl shadow-xl p-10 w-full max-w-sm fade-slide text-center">

    <div class="mb-6">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" alt="MediversAI Logo" class="h-12 mx-auto opacity-90">
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome back</h2>

    <form method="post" class="space-y-6 text-left">
        {% csrf_token %}
        {% if error %}
            <div class="mt-4 bg-red-50 border border-red-300 text-red-700 text-sm rounded-md px-4 py-2 leading-relaxed text-center">
                {{ error }}
            </div>
        {% endif %}

        <div>
            <input type="text" name="username" placeholder="Username" required
                   class="w-full border-b border-gray-300 py-2 text-sm placeholder-gray-400 bg-transparent focus:border-blue-500 transition duration-200">
        </div>

        <div>
            <input type="password" name="password" placeholder="Password" required
                   class="w-full border-b border-gray-300 py-2 text-sm placeholder-gray-400 bg-transparent focus:border-blue-500 transition duration-200">
        </div>

        <button type="submit"
                class="w-full text-sm py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-semibold transition duration-200 shadow-sm">
            Sign In
        </button>
    </form>

    <div class="mt-6">
        <a href="{% provider_login_url 'google' %}"
           class="w-full flex items-center justify-center space-x-3 py-2 px-4 rounded-full border border-gray-300 bg-white text-gray-700 hover:shadow-md transition duration-200 text-sm font-medium">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" class="w-5 h-5">
            <span>Sign in with Google</span>
        </a>
    </div>

    <p class="text-xs text-center text-gray-500 mt-6">
        Don’t have an account?
        <a href="{% url 'signup_choose_role' %}" class="text-blue-500 hover:underline font-medium">Sign up</a>
    </p>
</div>
</body>
</html>
