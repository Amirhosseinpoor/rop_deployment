{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'icons/mediversai_logo_final-032.png' %}">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-md rounded-3xl p-8 max-w-sm w-full flex flex-col items-center">
    <img src="{% static 'icons/mediversai_logo_final-03.png' %}" class="w-16 h-16 mb-4 opacity-80" alt="Logo">
    <h1 class="text-5xl font-bold text-blue-600 mb-2">404</h1>
    <p class="text-lg font-medium text-gray-600 mb-2 text-center">Page Not Found</p>
    <p class="text-sm text-gray-500 text-center mb-1">The page you are looking for does not exist.</p>
    <br>
    <br>
    <br>

    <a href="/"
       class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-full transition-all text-sm font-medium text-center">
        Back to Home
    </a>
</div>

</body>
</html>
