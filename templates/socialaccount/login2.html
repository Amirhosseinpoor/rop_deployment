{% load i18n %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in with Google | MediversAI</title>
    <link rel="icon" href="{% static 'icons/mediversai_logo_final-032.png' %}" type="image/png">
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
            color: #1f2937; /* text-gray-800 */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem; /* px-4 */
        }

        /* ===== Card Container ===== */
        .card {
            background-color: #ffffff;
            padding: 2rem; /* p-8 */
            border-radius: 1rem; /* rounded-2xl */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); /* shadow-lg */
            width: 100%;
            max-width: 28rem; /* max-w-md */
            text-align: center;
        }
        .card > * + * { margin-top: 1.5rem; } /* space-y-6 */

        /* ===== Logo ===== */
        .logo {
            height: 3rem; /* h-12 */
            display: block;
            margin: 0 auto;
            opacity: 0.9;
        }

        /* ===== Typography ===== */
        .heading { font-size: 1.5rem; font-weight: 700; } /* text-2xl, font-bold */
        .subtext { font-size: 0.875rem; color: #4b5563; } /* text-sm, text-gray-600 */

        /* ===== Google Button ===== */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem; /* space-x-2 */
            width: 100%;
            padding: 0.5rem 1rem; /* py-2 px-4 */
            border-radius: 9999px; /* rounded-full */
            background-color: #2563eb; /* bg-blue-600 */
            color: #ffffff;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .google-btn:hover { background-color: #1d4ed8; } /* hover:bg-blue-700 */
        .google-btn svg { width: 1.25rem; height: 1.25rem; } /* w-5 h-5 */
        .google-btn path { fill: #ffffff; } /* fill-white */

        .policy-text {
            font-size: 0.75rem; /* text-xs */
            color: #6b7280; /* text-gray-500 */
            margin-top: 1rem; /* mt-4 */
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Logo -->
    <div>
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" alt="Logo" class="logo">
    </div>

    <h1 class="heading">{% trans "Sign In Via Google" %}</h1>
    <p class="subtext">{% trans "You are about to sign in using a third-party account from Google." %}</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="google-btn">
            <!-- Google Logo Icon (inline SVG) -->
            <svg viewBox="0 0 488 512" xmlns="http://www.w3.org/2000/svg">
                <path d="M488 261.8c0-17.8-1.4-35-4-51.6H249v97.7h134.5c-5.8 31.3-23.3 57.8-49.4 75.5v62.7h79.8c46.6-42.9 73.1-106.2 73.1-184.3z" fill="#4285F4"/>
                <path d="M249 492c66.6 0 122.5-22 163.3-59.7l-79.8-62.7c-22.1 14.9-50.5 23.7-83.5 23.7-64 0-118.1-43.1-137.4-101.3H29.1v63.4C69.9 433.1 152.6 492 249 492z" fill="#34A853"/>
                <path d="M111.6 291.9c-4.8-14.4-7.6-29.6-7.6-45.2s2.7-30.8 7.6-45.2V138.1H29.1C10.4 175.8 0 216.6 0 258.1s10.4 82.3 29.1 120z" fill="#FBBC05"/>
                <path d="M249 103.4c36.3 0 68.9 12.5 94.5 37l70.8-70.8C371.5 26.4 315.6 0 249 0 152.6 0 69.9 58.9 29.1 138.1l82.5 63.4C130.9 146.5 185 103.4 249 103.4z" fill="#EA4335"/>
            </svg>
            <span>{% trans "Continue with Google" %}</span>
        </button>
    </form>

    <p class="policy-text">
        {% trans "By continuing, you agree to our terms and privacy policy." %}
    </p>
</div>

</body>
</html>
