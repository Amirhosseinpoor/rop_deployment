{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in with Google | MediversAI</title>
    <link rel="icon" href="{% static 'icons/mediversai_logo_final-032.png' %}" type="image/png">
    <style>
        /* ------------------------- */
        /* فونت سیستم (فارسی در صورت نیاز) */
        /* ------------------------- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* ------------------------- */
        /* متغیرهای ریشه – تم پزشکی */
        /* ------------------------- */
        :root {
            --medical-blue: #0A6EFF;
            --medical-teal: #00A896;
            --gray-100: #F8FAFD;
            --gray-200: #E9EDF5;
            --gray-600: #5B6B7C;
            --gray-800: #1E293B;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 32px rgba(0,0,0,0.08);
            --shadow-glow: 0 0 24px rgba(10,110,255,0.18);
            --radius-xl: 24px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(150deg, #E3F0FD 0%, #F2F8FF 50%, #FFFFFF 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            overflow-x: hidden;
        }

        /* الگوی هگزاگونال پزشکی (آفلاین) */
        .medical-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L52.5 17.5V42.5L30 55L7.5 42.5V17.5L30 5Z' fill='none' stroke='%230A6EFF' stroke-opacity='0.07' stroke-width='1'/%3E%3C/svg%3E");
            background-size: 80px 80px;
            opacity: 0.35;
        }

        /* کارت اصلی */
        .card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: var(--radius-xl);
            padding: 40px 35px 30px;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            animation: cardAppear 0.6s ease-out;
            text-align: center;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            height: 60px;
            margin-bottom: 20px;
        }

        .heading {
            font-size: 24px;
            font-weight: bold;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .subtext {
            font-size: 14px;
            color: var(--gray-600);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* دکمه گوگل (با آیکون رنگی) */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-lg);
            background: rgba(255,255,255,0.92);
            border: 1px solid var(--gray-200);
            color: var(--gray-800);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }
        .google-btn:hover {
            background: #ffffff;
            border-color: var(--medical-blue);
            transform: translateY(-1px);
        }
        .google-icon svg {
            width: 22px;
            height: 22px;
        }

        .policy-text {
            margin-top: 26px;
            font-size: 13px;
            color: var(--gray-600);
            line-height: 1.6;
        }

        /* تغییر تم */
        .theme-toggle {
            position: fixed;
            left: 24px;
            top: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: rgba(255,255,255,0.92);
            border: 1px solid rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            z-index: 100;
        }
        .theme-toggle:hover {
            background: white;
            box-shadow: var(--shadow-md);
        }

        /* حالت تاریک */
        .dark body {
            background: linear-gradient(150deg, #0B1121 0%, #131A2E 50%, #1A2540 100%);
        }
        .dark .medical-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 5L52.5 17.5V42.5L30 55L7.5 42.5V17.5L30 5Z' fill='none' stroke='%234F90FF' stroke-opacity='0.12' stroke-width='1'/%3E%3C/svg%3E");
            opacity: 0.25;
        }
        .dark .card {
            background: rgba(24,30,50,0.8);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 0 30px rgba(255,255,255,0.03);
        }
        .dark .heading {
            color: #EDF2F9;
        }
        .dark .subtext,
        .dark .policy-text {
            color: #B9C5DA;
        }
        .dark .google-btn {
            background: rgba(255,255,255,0.08);
            border-color: #2D3A50;
            color: #E2E8F0;
        }
        .dark .google-btn:hover {
            background: rgba(255,255,255,0.14);
        }
        .dark .theme-toggle {
            background: rgba(30,40,65,0.8);
            color: #E2E8F0;
            border-color: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="medical-bg"></div>

    <div class="theme-toggle" id="themeToggle">🌓</div>

    <div class="card">
        <img src="{% static 'icons/mediversai_logo_final-03.png' %}" alt="Logo" class="logo">

        <h1 class="heading">{% trans "Sign In Via Google" %}</h1>
        <p class="subtext">{% trans "You are about to sign in using a third-party account from Google." %}</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="google-btn">
                <span class="google-icon">
                    <!-- آیکون گوگل چند رنگی -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </span>
                <span>{% trans "Continue with Google" %}</span>
            </button>
        </form>

        <p class="policy-text">
            {% trans "By continuing, you agree to our terms and privacy policy." %}
        </p>
    </div>

    <script>
        const root = document.documentElement;
        const toggle = document.getElementById("themeToggle");
        if (localStorage.getItem("theme") === "dark") root.classList.add("dark");
        toggle.onclick = () => {
            root.classList.toggle("dark");
            localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
        };
    </script>
</body>
</html>
